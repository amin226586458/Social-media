  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .recaptcha-box {
      width: 340px;
      min-width: 340px;
      height: auto;
      min-height: 78px;
      padding: 12px 14px;
      transition: all 0.4s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ===== الصف الرئيسي ===== */
    .captcha-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 6px;
    }

    /* ===== القسم الأيسر (المربع + النص) ===== */
    .captcha-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    /* ===== المربع ===== */
    .checkbox-wrapper {
      position: relative;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #captcha-checkbox {
      width: 28px;
      height: 28px;
      border: 2px solid #c1c1c1;
      background: white;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    #captcha-checkbox:hover {
      box-shadow: 0 0 4px rgba(74, 144, 226, 0.4);
    }

    #captcha-checkbox:focus-visible {
      border-color: #4a90e2;
      box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
      outline: none;
    }

    /* ===== النص ===== */
    #captcha-text {
      font-size: 14px;
      font-weight: 400;
      color: #000000;
      line-height: 1.3;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 60px;
      flex: 1;
    }

    /* ===== القسم الأيمن (الشعار + البنود) ===== */
    .captcha-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      min-width: 70px;
      text-align: center;
    }

    .captcha-right .logo {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .captcha-right .logo img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      transform: scale(1.3);
    }

    .captcha-right .brand-name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #555;
      line-height: 1;
      margin-top: 1px;
    }

    .captcha-right .links {
      display: flex;
      gap: 6px;
      font-size: 8px;
      margin-top: 3px;
      opacity: 0.8;
    }

    .captcha-right .links a {
      color: #555;
      text-decoration: none;
    }

    .captcha-right .links a:hover {
      text-decoration: underline;
    }

    .captcha-right .links .dot {
      font-size: 6px;
      color: #888;
    }

    /* ===== Spinner ===== */
    #captcha-spinner {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
    }

    #captcha-spinner svg {
      width: 28px;
      height: 28px;
      animation: spin 1s linear infinite;
    }

    /* ===== Success ===== */
    #captcha-success {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
    }

    #captcha-success svg {
      width: 28px;
      height: 28px;
      color: #00aa45;
    }

    /* ===== Animations ===== */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes successPop {
      0% { transform: scale(0) rotate(-45deg); opacity: 0; }
      50% { transform: scale(1.3) rotate(0deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10% { transform: translateX(-4px); }
      20% { transform: translateX(4px); }
      30% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      50% { transform: translateX(-2px); }
      60% { transform: translateX(2px); }
      70% { transform: translateX(-1px); }
      80% { transform: translateX(1px); }
      90% { transform: translateX(-1px); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 5px rgba(74, 144, 226, 0.2); }
      50% { box-shadow: 0 0 20px rgba(74, 144, 226, 0.6); }
    }

    /* ===== States ===== */
    .state-loading #captcha-checkbox {
      display: none !important;
    }
    .state-loading #captcha-spinner {
      display: flex !important;
    }

    .state-success #captcha-spinner,
    .state-success #captcha-checkbox {
      display: none !important;
    }
    .state-success #captcha-success {
      display: flex !important;
    }
    .state-success #captcha-success svg {
      animation: successPop 0.5s ease-out;
    }
    .state-success .recaptcha-box {
      background-color: #fafafa;
      border-color: #e0e0e0;
      animation: glow 1s ease-in-out 2;
    }

    /* ===== Error State ===== */
    .state-error #captcha-checkbox {
      border-color: #cccccc !important;
      background-color: #f8f8f8 !important;
    }
    .state-error #captcha-text {
      color: #888888 !important;
      font-size: 13px !important;
      font-weight: 400 !important;
    }
    .state-error .recaptcha-box {
      min-height: 85px !important;
      padding: 14px 16px !important;
      border-color: #d8d8d8 !important;
      background-color: #fbfbfb !important;
    }

    /* ===== Social Buttons ===== */
    #social-buttons {
      transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      gap: 16px;
      margin-top: 24px;
      opacity: 0;
      pointer-events: none;
    }

    #social-buttons.show {
      opacity: 1;
      pointer-events: auto;
    }

    #social-buttons a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    #social-buttons a:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .whatsapp-btn {
      background: #25D366;
      color: white;
    }
    .whatsapp-btn:hover {
      background: #1da851;
    }

    .instagram-btn {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
    }
    .instagram-btn:hover {
      opacity: 0.9;
    }

    .text-transition {
      transition: opacity 0.3s ease-in-out, color 0.5s ease;
    }

    #final-message {
      margin-top: 32px;
      color: #9ca3af;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
    }

    #final-message.show {
      opacity: 1;
    }
  </style>

</head>

<body class="bg-[#f9f9f9] flex items-center justify-center min-h-screen font-sans">

        <!-- ===== الصف الرئيسي ===== -->
        <div class="captcha-row">

          <!-- ===== القسم الأيسر (المربع + النص) ===== -->
